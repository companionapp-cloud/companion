name: Release

# Fires when a version tag is pushed (e.g. v0.0.0, v1.2.3). Builds the server for
# every desktop/server OS + a Linux Docker image, the cloud as a Linux Docker
# image, and the offline WASM web app as a Linux Docker image, then attaches the
# binaries and image links to the GitHub release. Building the web image here (vs.
# on every push to main) keeps the web app in lockstep with the server/cloud
# releases — one tag ships all three at the same version.
#
# It also builds the macOS desktop app (Wails needs cgo + WebKit, so that job runs
# on a macOS runner), attaches Companion-<version>-macos-universal.zip to the
# release, and publishes it to Homebrew: the `homebrew-tap` job stamps the new
# version + sha256 into homebrew/Casks/companion.rb and pushes the whole homebrew/
# folder to the companionapp-cloud/homebrew-tap repo, which is what
# `brew tap companionapp-cloud/tap` clones. That folder is the tap's only source;
# the tap repo is never edited by hand.
#
# Installed apps update themselves from here too (apps/desktop/updates.go): once a
# stable release carries the macOS zip, every running copy older than it installs it
# within the hour. Tags with a suffix (v1.2.3-rc1) are published as prereleases, which
# the updater, like Homebrew, never installs.
#
# One-time setup for the tap:
#   - Create the (public) repo companionapp-cloud/homebrew-tap. It can be empty.
#   - Generate a key pair:  ssh-keygen -t ed25519 -N "" -f tap-deploy-key -C "companion release -> homebrew-tap"
#   - Add tap-deploy-key.pub to the tap repo under Settings → Deploy keys, with
#     "Allow write access" ticked.
#   - Add the private key (tap-deploy-key, the whole file) as the
#     HOMEBREW_TAP_DEPLOY_KEY Actions secret on THIS repo
#     (Settings → Secrets and variables → Actions), then delete the local files.
#   A deploy key is scoped to the one repo, never expires, and isn't tied to a
#   person's account, which is why it's used instead of a PAT.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases: v1.2.3-rc1
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.0.0"
        required: true

permissions:
  contents: write # create the release + upload binaries
  packages: write # push images to GHCR

env:
  # GHCR image names. github.repository_owner is already lowercase for this repo;
  # the images job lowercases defensively regardless.
  SERVER_IMAGE: companion-server
  CLOUD_IMAGE: companion-cloud
  WEB_IMAGE: companion-web
  # Homebrew tap that the `homebrew-tap` job pushes homebrew/ into.
  TAP_REPO: companionapp-cloud/homebrew-tap
  TAP_BRANCH: main

jobs:
  # ---------------------------------------------------------------------------
  # Cross-compiled server binaries for every supported OS/arch. The store driver
  # is pure Go (modernc.org/sqlite), so CGO_ENABLED=0 lets one Linux runner emit
  # static binaries for macOS and Windows too — no per-OS runners needed.
  # ---------------------------------------------------------------------------
  server-binaries:
    name: server (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: apps/server/go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="dist/companion-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          go build -C apps/server -trimpath -ldflags="-s -w" -o "$(pwd)/$out" .
          ls -lh "$out"

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Whichever job attaches first creates the release; each sets the same flag.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: dist/companion-server-*

  # ---------------------------------------------------------------------------
  # Linux Docker images for the server, cloud, and web app, pushed to GHCR.
  # server/cloud are multi-arch; the web image is amd64-only (Go -> wasm + Vite
  # build served by Caddy). The Railway services watch each image's :latest tag
  # and auto-deploy the new digest — no deploy call from CI is needed.
  # ---------------------------------------------------------------------------
  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server, image: companion-server, dockerfile: apps/server/Dockerfile, platforms: "linux/amd64,linux/arm64" }
          - { name: cloud, image: companion-cloud, dockerfile: apps/cloud/Dockerfile, platforms: "linux/amd64,linux/arm64" }
          - { name: web, image: companion-web, dockerfile: apps/web/Dockerfile, platforms: "linux/amd64" }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag + lowercase owner
        id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ref }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # macOS desktop app. Wails v3 links against WebKit through cgo, so this can't be
  # cross-compiled from Linux like the server. The arm64 runner builds both slices
  # (Go passes the right -arch to clang for darwin/amd64) and lipo joins them into
  # one universal binary. The bundle is ad-hoc signed: CI has no Apple signing
  # identity, so the cask's postflight_steps strip quarantine (see homebrew/README.md).
  # The in-app updater downloads this same zip without quarantining it.
  # ---------------------------------------------------------------------------
  desktop-macos:
    name: desktop (macOS universal)
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      asset: ${{ steps.pack.outputs.asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            apps/desktop/go.sum
            core/go.sum

      - name: Build webview frontend
        run: |
          npm ci
          npm run build -w @companion/desktop-frontend

      - name: Build universal binary
        env:
          CGO_ENABLED: "1"
          # Matches LSMinimumSystemVersion in apps/desktop/packaging/Info.plist.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # main.version is what the in-app updater compares with the latest release
          # (apps/desktop/updates.go); builds without it never update themselves.
          ldflags="-s -w -X main.version=${TAG#v}"
          mkdir -p build
          GOARCH=arm64 go build -C apps/desktop -trimpath -ldflags="$ldflags" -o "$(pwd)/build/companion-desktop-arm64" .
          GOARCH=amd64 go build -C apps/desktop -trimpath -ldflags="$ldflags" -o "$(pwd)/build/companion-desktop-amd64" .
          lipo -create -output build/companion-desktop build/companion-desktop-arm64 build/companion-desktop-amd64
          lipo -info build/companion-desktop

      - name: Bundle, sign (ad-hoc) and zip
        id: pack
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          app="build/Companion.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp apps/desktop/packaging/Info.plist "$app/Contents/Info.plist"
          cp apps/desktop/packaging/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          cp build/companion-desktop "$app/Contents/MacOS/companion-desktop"
          # Stamp the release version over the placeholder in the checked-in plist.
          plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"
          codesign --force --sign - --identifier com.companion.desktop "$app"
          codesign --verify --verbose=2 "$app"

          asset="Companion-${version}-macos-universal.zip"
          # ditto (not zip) keeps the bundle layout, symlinks and signature intact.
          # --norsrc --noextattr: plain files only. Otherwise any extended attribute on
          # the build (e.g. com.apple.provenance) is stored as an AppleDouble ._ entry,
          # which the in-app updater unpacks as a real file inside the bundle, breaking
          # its seal.
          ditto -c -k --norsrc --noextattr --keepParent "$app" "build/$asset"
          # The in-app updater wants exactly one top-level Companion.app and refuses a
          # broken seal; fail here rather than ship a zip installed apps can't take.
          if zipinfo -1 "build/$asset" | grep -E '(^|/)\._|^__MACOSX/'; then
            echo "::error::$asset contains AppleDouble entries"
            exit 1
          fi
          if [ "$(zipinfo -1 "build/$asset" | cut -d/ -f1 | sort -u)" != "Companion.app" ]; then
            echo "::error::$asset must contain only Companion.app at the top level"
            exit 1
          fi
          sha="$(shasum -a 256 "build/$asset" | cut -d' ' -f1)"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          ls -lh "build/$asset"
          echo "sha256 $sha"

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: build/Companion-*-macos-universal.zip

  # ---------------------------------------------------------------------------
  # Publish to Homebrew: mirror this repo's homebrew/ folder into the tap repo
  # with the cask's version + sha256 stamped from the bundle built above.
  # Pre-releases (v1.2.3-rc1) are skipped so the tap only ever serves stable
  # builds. The tap repo may be empty on the very first run.
  # ---------------------------------------------------------------------------
  homebrew-tap:
    name: homebrew tap
    runs-on: ubuntu-latest
    needs: [desktop-macos]
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the tap deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is not set; cannot push to $TAP_REPO"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          # Pin GitHub's host keys rather than trusting on first use.
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Every git call in this job goes through this key and nothing else.
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/tap_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Sync homebrew/ into the tap and push
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA256: ${{ needs.desktop-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          remote="git@github.com:${TAP_REPO}.git"

          # Clone the tap (works on an empty repo too; falls back to init if the
          # repo has no default branch yet).
          rm -rf tap
          git clone --depth 1 --branch "$TAP_BRANCH" "$remote" tap 2>/dev/null \
            || { git clone --depth 1 "$remote" tap; }
          git -C tap checkout -B "$TAP_BRANCH"

          # Mirror the folder. --delete keeps the tap identical to homebrew/;
          # .git is the only thing preserved.
          rsync -a --delete --exclude .git homebrew/ tap/

          # Stamp the release into the cask.
          cask="tap/Casks/companion.rb"
          sed -i -E \
            -e "s|^([[:space:]]*version )\"[^\"]*\"|\1\"${version}\"|" \
            -e "s|^([[:space:]]*sha256 )\"[^\"]*\"|\1\"${SHA256}\"|" \
            "$cask"
          grep -E '^[[:space:]]*(version|sha256) ' "$cask"
          if ! grep -q "version \"${version}\"" "$cask" || ! grep -q "sha256 \"${SHA256}\"" "$cask"; then
            echo "::error::failed to stamp version/sha256 into $cask"
            exit 1
          fi

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tap already up to date for ${version}"
            exit 0
          fi
          git commit -m "companion ${version}" \
            -m "Synced from companionapp-cloud/companion@${GITHUB_SHA} (tag ${TAG})."
          git push origin "HEAD:${TAP_BRANCH}"

  # ---------------------------------------------------------------------------
  # Once the images are pushed, append their GHCR links to the release notes.
  # ---------------------------------------------------------------------------
  release-notes:
    name: release notes
    runs-on: ubuntu-latest
    needs: [server-binaries, images, desktop-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Append Docker image links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${TAG#v}"
          notes=$(cat <<EOF

          ### macOS desktop (Homebrew)

          \`\`\`bash
          brew install --cask companionapp-cloud/tap/companion
          \`\`\`

          The bundle is ad-hoc signed; the cask strips the quarantine attribute after
          install. If you download \`Companion-${version}-macos-universal.zip\` above
          instead, run \`xattr -dr com.apple.quarantine Companion.app\` after unzipping.
          Either way, Companion keeps itself up to date from then on.

          ### Docker images

          - Server: \`ghcr.io/${owner}/${SERVER_IMAGE}:${version}\`
            <https://ghcr.io/${owner}/${SERVER_IMAGE}>
          - Cloud: \`ghcr.io/${owner}/${CLOUD_IMAGE}:${version}\`
            <https://ghcr.io/${owner}/${CLOUD_IMAGE}>

          \`\`\`bash
          docker pull ghcr.io/${owner}/${SERVER_IMAGE}:${version}
          docker pull ghcr.io/${owner}/${CLOUD_IMAGE}:${version}
          \`\`\`
          EOF
          )
          # Preserve any existing body (e.g. autogenerated notes) and append ours.
          existing=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          printf '%s\n%s\n' "$existing" "$notes" > body.md
          gh release edit "$TAG" --notes-file body.md
