<!doctype html>
<!-- The updater window (apps/desktop/update_window.go): a page of its own, apart from the app. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Updating Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("companion.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
    <style>
      /* No fixed heights: the page's own height is what the window is fitted to. */
      html, body { margin: 0; overflow: hidden; }
      body { background: #f5f5f3; color: #1a1a18; cursor: default; -webkit-user-select: none; user-select: none;
             font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      [data-theme="dark"] body { background: #121211; color: #ededea; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/updater.tsx"></script>
  </body>
</html>
